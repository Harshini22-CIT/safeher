
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHer - Biometric Safety Mesh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .safe-gradient {
            background: linear-gradient(135deg, #fff1f2 0%, #fdf2f8 100%);
        }
        .at-risk-gradient {
            background: linear-gradient(135deg, #fff1f2 0%, #fff7ed 100%);
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }
        .animate-heartbeat {
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        @keyframes pulse-rose {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .emergency-pulse {
            animation: pulse-rose 1.5s infinite;
        }
        @keyframes wave {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -100; }
        }
        .animate-wave {
            stroke-dasharray: 20, 80;
            animation: wave 3s linear infinite;
        }
        #map { height: 100%; width: 100%; border-radius: 40px; }
        .gm-style-iw { border-radius: 20px !important; padding: 0 !important; }
    </style>

</html>
